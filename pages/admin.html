<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin – BeautyFull Salon & Barbershop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" crossorigin src="/beautyfull-salon-barbershop/assets/script-CK4YXlX3.js"></script>
  <link rel="stylesheet" crossorigin href="/beautyfull-salon-barbershop/assets/script-fkMQOZ0o.css">
</head>
<body>

<section class="section">
  <div class="section-inner" style="max-width:900px;">

    <h1 class="section-title">Panneau Administrateur</h1>
    <p class="section-subtitle">Gestion des rendez-vous enregistrés</p>

    <!-- Authentification -->
    <div id="auth-container" class="rdv-form" style="margin-top:2rem;">
      <h3 style="margin-bottom:1rem;">Connexion admin</h3>

      <div class="form-group">
        <label>Code secret</label>
        <input type="password" id="adminCode" placeholder="****">
      </div>

      <button id="loginBtn" class="btn-submit">Se connecter</button>
    </div>

    <!-- Panel admin -->
    <div id="admin-panel" style="display:none; margin-top:3rem;">

      <button id="logoutBtn" class="btn-primary" style="margin-bottom:1.6rem;">Déconnexion</button>

      <!-- TABLEAU LOCALSTORAGE (EXISTANT) -->
      <h2 class="section-subtitle" style="margin-bottom:0.8rem;">Rendez-vous (stockés sur cet appareil)</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Service</th>
            <th>Date</th>
            <th>Heure</th>
            <th>Supprimer</th>
          </tr>
        </thead>
        <tbody id="rdvTableBody">
          <!-- JS injecte ici -->
        </tbody>
      </table>

      <button id="clearAll" class="btn-submit" style="background:#B02124;color:white; margin-top:1rem;">
        Supprimer tous les rendez-vous (local)
      </button>

      <!-- TABLEAU FIRESTORE (CLOUD) -->
      <h2 class="section-subtitle" style="margin-top:2.5rem; margin-bottom:0.8rem;">
        Rendez-vous en ligne (cloud)
      </h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Service</th>
            <th>Date</th>
            <th>Heure</th>
            <th>Supprimer</th>
          </tr>
        </thead>
        <tbody id="rdvCloudTableBody">
          <!-- JS injecte ici les données Firestore -->
        </tbody>
      </table>

    </div>

  </div>
</section>

<footer class="site-footer">
  © <span id="year"></span> BeautyFull Salon & Barbershop – Évry-Courcouronnes.
</footer>


</body>
</html>
