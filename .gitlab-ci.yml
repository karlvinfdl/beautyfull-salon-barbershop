# .gitlab-ci.yml pour Vite + GitLab Pages (SPA friendly)
image: node:18

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

variables:
  NODE_ENV: production

before_script:
  - npm ci
  - npm install -g vite

build:
  stage: build
  script:
    - npm run build        # crée le dossier dist
  artifacts:
    paths:
      - dist
    expire_in: 1 week

pages:
  stage: deploy
  script:
    # préparer le dossier public pour GitLab Pages
    - mkdir .public
    - cp -r dist/* .public/
    # créer un fallback 404.html pour SPA
    - echo '<meta http-equiv="refresh" content="0; url=index.html">' > .public/404.html
  artifacts:
    paths:
      - .public
  only:
    - main
