<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Prendre rendez-vous – BeautyFull Salon & Barbershop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script type="module" crossorigin src="/beautyfull-salon-barbershop/assets/script-LON7mB7F.js"></script>
  <link rel="stylesheet" crossorigin href="/beautyfull-salon-barbershop/assets/style-D3cCKqLo.css">
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <div class="logo-block">
      <div class="logo-main">BeautyFull</div>
      <div class="logo-sub">Salon & Barbershop</div>
    </div>

    <button id="menu-toggle" class="menu-toggle">☰</button>
    <nav id="nav-menu">
      <a href="../index.html" class="nav-link">Accueil</a>
      <a href="../index.html#services" class="nav-link">Services</a>
      <a href="../index.html#galerie" class="nav-link">Galerie</a>
      <a href="../index.html#avis" class="nav-link">Avis</a>
      <a href="../index.html#contact" class="nav-link">Contact</a>
      <a href="./rendez-vous.html" class="nav-link nav-gold">Rendez-vous</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="section-inner">
    <h1 class="section-title">Prendre rendez-vous</h1>
    <p class="section-subtitle">
      Choisissez votre créneau et validez votre réservation.
    </p>

    <form id="rdvForm" class="rdv-form">

      <div class="form-group">
        <label>Nom complet *</label>
        <input type="text" id="nom" required placeholder="Ex : Samira Diallo">
      </div>

      <div class="form-group">
        <label>Téléphone *</label>
        <input type="tel" id="tel" required placeholder="06 xx xx xx xx">
      </div>

      <div class="form-group">
        <label>Email (optionnel)</label>
        <input type="email" id="email" placeholder="email@example.com">
      </div>

      <div class="form-group">
        <label>Service souhaité *</label>
        <select id="service" required>
          <option value="">Sélectionnez un service...</option>
          <option>Coupe homme</option>
          <option>Dégradé / Fade</option>
          <option>Coupe + Barbe</option>
          <option>Coloration / Mèches</option>
          <option>Soin cheveux afro</option>
          <option>Coupe femme & brushing</option>
          <option>Coupe enfant</option>
        </select>
      </div>

      <div class="form-group">
        <label>Date souhaitée *</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label>Heure souhaitée *</label>
        <select id="heure" required></select>
      </div>

      <button type="submit" class="btn-submit">Valider le rendez-vous</button>
      <p class="rdv-note">Une confirmation WhatsApp vous sera envoyée.</p>

    </form>

  </div>
</section>

<footer class="site-footer">
  © <span id="year"></span> BeautyFull Salon & Barbershop – Évry-Courcouronnes.
</footer>


</body>
</html>
